# CodeQL によるコードスキャン（Swift）。
#
# GitHub の「Default setup」は `xcodebuild -target Thoth` でビルドするため、
# Swift Package 同士の依存（Magnet → Sauce）の順序が解決されず
# 「no such module 'Sauce'」で失敗する。ここではスキームを指定してビルドする。
#
# このワークフローを有効にするには、Settings → Code security → CodeQL analysis の
# Default setup を無効にしておく（両方が有効だと結果のアップロードが拒否される）。
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # SwiftLint は解析に関係しないので省く（SKIP_SWIFTLINT はビルドフェーズ側で見ている）
      - name: Build
        run: |
          xcodebuild build \
            -project Thoth.xcodeproj \
            -scheme Thoth \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            SKIP_SWIFTLINT=1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
