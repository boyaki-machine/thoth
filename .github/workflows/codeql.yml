# CodeQL によるコードスキャン（Swift）。
#
# GitHub の「Default setup」は `xcodebuild -target Thoth` でビルドするため、
# Swift Package 同士の依存（Magnet → Sauce）の順序が解決されず
# 「no such module 'Sauce'」で失敗する。ここではスキームを指定してビルドする。
#
# このワークフローを有効にするには、Settings → Code security → CodeQL analysis の
# Default setup を無効にしておく（両方が有効だと結果のアップロードが拒否される）。
name: CodeQL

# アクションはタグではなくコミット SHA で固定する（タグの付け替えによる改ざんを防ぐ。
# 2025 年の tj-actions/changed-files の事件を受けた GitHub の推奨）。
# 版上げは .github/dependabot.yml の Dependabot が SHA とコメントの版をまとめて更新する。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# 既定ではトークンに権限を与えず、ジョブごとに必要なものだけを付ける
permissions: {}

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のステップで push などをしないので、認証情報をディスクに残さない
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: swift
          build-mode: manual

      # SwiftLint は解析に関係しないので省く（SKIP_SWIFTLINT はビルドフェーズ側で見ている）
      # CodeQL のトレーサー下では xcodebuild が x86_64 として動き、「My Mac」が x86_64 扱いになる。
      # アプリは ARCHS = arm64 のみなので 'platform=macOS' だと一致する宛先がなく失敗する。
      # 実機を選ばない generic の宛先（Any Mac）にして、プロジェクトの ARCHS でビルドさせる。
      - name: Build
        run: |
          xcodebuild build \
            -project Thoth.xcodeproj \
            -scheme Thoth \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            SKIP_SWIFTLINT=1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:swift"
